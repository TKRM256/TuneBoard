spring.application.name=tubeboard

# 会場書式の背景・ステージの下絵のアップロード。上限（5MB）超えの判定はアプリ側で行い、
# ここでは少し大きめに受け付けて分かりやすいエラーを返せるようにする
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# 画面表示中に遅延読み込みを許すと、トランザクション外の DB アクセスがテストで見逃される。dev・prod と揃えて切る
spring.jpa.open-in-view=false

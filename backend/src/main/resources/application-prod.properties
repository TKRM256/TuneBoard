spring.application.name=tubeboard

# ──────────────────────────────────────
# Server (Cloud Run injects PORT env var)
# ──────────────────────────────────────
server.port=${PORT:8080}

# ──────────────────────────────────────
# Datasource (Supabase PostgreSQL)
# ──────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ──────────────────────────────────────
# JPA / Hibernate
# ──────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ──────────────────────────────────────
# Flyway
# ──────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ──────────────────────────────────────
# H2 Console (disabled in prod)
# ──────────────────────────────────────
spring.h2.console.enabled=false

# ──────────────────────────────────────
# CORS (Vercel frontend URL)
# ──────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cors.allowed-credentials=true

# ──────────────────────────────────────
# OAuth2 (Google)
# ──────────────────────────────────────
app.frontend-base-url=${FRONTEND_BASE_URL}
app.oauth.google.client-id=${GOOGLE_CLIENT_ID}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET}
app.oauth.google.redirect-uri=${OAUTH_REDIRECT_URI}
app.auth.cookie-secure=true
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ──────────────────────────────────────
# JWT
# ──────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:3600000}
